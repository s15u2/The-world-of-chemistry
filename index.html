<div id="start"><h1>عالم الكيمياء</h1><p>مركز علمي ثلاثي الأبعاد بخمسة أقسام: الورد، الصحة، الجمال، الحياة اليومية، والسعودية. تجوّل وتحدّث مع المشرفات وجرّب وتسوّق.</p><button id="go">ادخل العالم</button></div>

<script>
const T=THREE,$=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.prepend(R.domElement);
const S=new T.Scene();S.background=new T.Color(0xcfe3f0);S.fog=new T.Fog(0xcfe3f0,35,100);
const C=new T.PerspectiveCamera(60,1,.1,200);

const sun=new T.DirectionalLight(0xfff2d8,.8);sun.position.set(12,30,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:30,bottom:-30,far:80});S.add(sun);
const M=(c,r=.8)=>new T.MeshStandardMaterial({color:c,roughness:r});
function box(w,h,d,c,x,y,z,p=S){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m}
function cyl(a,b,h,c,x,y,z,p=S){const m=new T.Mesh(new T.CylinderGeometry(a,b,h,16),M(c,.5));m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}
function sph(r,c,x,y,z,p=S){const m=new T.Mesh(new T.SphereGeometry(r,16,12),M(c,.6));m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}
function sign(txt,w,h,bg,fg,x,y,z,ry){const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.direction='rtl';let fs=84;do{g.font=`800 ${fs}px Tajawal,sans-serif`;fs-=4}while(g.measureText(txt).width>c.width-30&&fs>14);g.fillText(txt,256,c.height/2);
const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c)}));m.position.set(x,y,z);m.rotation.y=ry;S.add(m);return m}
function tag(g,txt){const c=document.createElement('canvas');c.width=320;c.height=72;const x=c.getContext('2d');x.fillStyle='#10162bdd';x.fillRect(0,0,320,72);x.fillStyle='#e8b04a';x.font='800 34px Tajawal,sans-serif';x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillText(txt,160,38);
const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c)}));s.scale.set(1.5,.34,1);s.position.y=2.15;g.add(s)}
/* humans */
const GB=new T.BoxGeometry(1,1,1),GS=new T.SphereGeometry(1,16,12),GC=new T.CylinderGeometry(1,1,1,10),GA=new T.CylinderGeometry(.14,.3,1.1,14);
function part(G,c,sx,sy,sz,x,y,z,p){const m=new T.Mesh(G,M(c,.85));m.scale.set(sx,sy,sz);m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}
function human(o){const g=new T.Group();
part(GB,o.top,.46,.62,.26,0,1.25,0,g);
if(o.abaya!=null)part(GA,o.abaya,1,1,1,0,.6,0,g);
const L=[-1,1].map(sx=>{const p=new T.Group();p.position.set(sx*.12,.85,0);g.add(p);part(GC,o.bot,.075,.8,.075,0,-.4,0,p);part(GB,0x222222,.1,.07,.2,0,-.82,.04,p);return p});
const A=[-1,1].map(sx=>{const p=new T.Group();p.position.set(sx*.29,1.5,0);g.add(p);part(GC,o.top,.055,.6,.055,0,-.3,0,p);part(GS,o.skin,.05,.05,.05,0,-.63,0,p);return p});
part(GS,o.skin,.13,.15,.13,0,1.72,0,g);
if(o.hij!=null){part(GS,o.hij,.16,.18,.16,0,1.73,-.015,g);part(GA,o.hij,.95,.4,.8,0,1.5,-.01,g);part(GS,o.skin,.1,.12,.06,0,1.72,.1,g)}
[-1,1].forEach(sx=>part(GS,0x1a1a1a,.013,.013,.013,sx*.04,1.74,.155,g));
g.userData={L,A};return g}
const SK=[0xf0c8a0,0xd8a27a,0xb87a55,0x8a5a3c],AB=[0x1b1b1f,0x23324a,0x3b2f35,0x2f3d36,0x4a3b52],HJ=[0x1b1b1f,0xf1e8d8,0x7a4b6e,0x2c5a73,0xb6905a],TP=[0xc2476b,0x3b82a0,0x6a9955,0xd89a3c,0x7a65b8];
const NP=[],IA=[],W=[],BL=[],DR=[];
function spawn(x,z,mode,o={}){const sit=mode==='sit';
const g=human({skin:pick(SK),top:o.top??pick(TP),bot:0x2b2f3a,abaya:sit?null:(o.abaya===undefined?pick(AB):o.abaya),hij:o.hij??pick(HJ)});
g.position.set(x,sit?-.38:0,z);S.add(g);
const n={g,mode,x,z,t:rr(0,6),f:o.f,r:o.r,tg:null,sit};
if(o.f)g.rotation.y=Math.atan2(o.f[0]-x,o.f[1]-z);
if(o.name)tag(g,o.name);NP.push(n);return n}
const inR=(x,z)=>W.some(r=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3]);
const free=(x,z)=>inR(x,z)&&!BL.some(r=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3]);
const blk=(x,z,w,d)=>BL.push([x-w/2,x+w/2,z-d/2,z+d/2]);
function reg(obj,ia){IA.push(ia);obj.traverse(m=>m.userData.ia=ia)}

const PP=$('P'),Pt=$('Pt'),Pb=$('Pb'),Pa=$('Pa');let open=false;
function P(t,html,btns=[]){Pt.textContent=t;Pb.innerHTML=html;Pa.innerHTML='';[...btns,{t:'إغلاق',f:cl}].forEach(b=>{const e=document.createElement('button');e.textContent=b.t;e.onclick=b.f;Pa.appendChild(e)});PP.hidden=false;open=true}
function cl(){PP.hidden=true;open=false}
const cart=[];
function addC(it){cart.push(it);$('cn').textContent=cart.length}
function showCart(){const tot=cart.reduce((a,b)=>a+b[1],0);P('سلة المشتريات',cart.length?'<ul>'+cart.map(x=>`<li>${x[0]} — ${x[1]} نقطة</li>`).join('')+`</ul><p>المجموع: ${tot} نقطة تعليمية</p>`:'<p>السلة فارغة. زر المتجر في أي قسم.</p>',[{t:'تفريغ السلة',f:()=>{cart.length=0;$('cn').textContent=0;cl()}}])}

function exp(r){const e=r.ex;let i=0;P(e.t,'<div id="bk"><div id="lq"></div></div><p id="q"></p><div id="o"></div>');const lq=$('lq'),q=$('q'),o=$('o');

s.o.map((t,k)=>[t,k]).sort(()=>Math.random()-.5).forEach(([t,k])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(k===0){lq.style.background=s.c;lq.style.height=s.h+'%';lq.className=s.fx?'fx':'';i++;step()}else q.textContent='ليست مناسبة: '+s.w};o.appendChild(b)})};step()}
function sup(r){P('المشرفة '+r.sn+' — '+r.n,`<p>${r.hi}</p>`,[...r.qa.map(([a,b])=>({t:a,f:()=>{Pb.innerHTML='<p>'+b+'</p>'}})),{t:'ابدأ تجربة في المختبر',f:()=>exp(r)}])}
/* models */
const MD={
rose:()=>{const g=new T.Group();cyl(.03,.03,.5,0x3c7a3a,0,.25,0,g);sph(.18,0xc2203f,0,.58,0,g);sph(.12,0xe03a5c,0,.66,0,g);return g},
heart:()=>{const g=new T.Group();sph(.25,0xc0242b,0,.4,0,g);sph(.15,0xd9404a,.14,.62,0,g);cyl(.04,.04,.3,0x4a6fa5,-.1,.7,0,g);return g},
stomach:()=>{const g=new T.Group();sph(.26,0xe59a9a,0,.35,0,g).scale.set(1.4,.9,.8);return g},
bottle:(c=0xb48bd0)=>{const g=new T.Group();cyl(.12,.12,.4,c,0,.2,0,g);cyl(.05,.05,.12,0xe8c46a,0,.46,0,g);return g},
flask:(c=0x7fd3e8)=>{const g=new T.Group();const m=cyl(.05,.2,.35,c,0,.2,0,g);m.material.transparent=true;m.material.opacity=.7;cyl(.05,.05,.2,c,0,.45,0,g);return g},
bread:()=>{const g=new T.Group();sph(.25,0xc98b4a,0,.2,0,g).scale.set(1.5,.7,.8);return g},
tower:()=>{const g=new T.Group();cyl(.03,.3,1,0x555a66,0,.5,0,g);cyl(.02,.2,.5,0x7a808c,0,1.15,0,g);sph(.05,0xd9443a,0,1.45,0,g);return g},
palm:()=>{const g=new T.Group();cyl(.07,.1,1,0x7a5a3a,0,.5,0,g);for(let i=0;i<6;i++){const l=cyl(.01,.1,.7,0x2e7d4f,Math.cos(i)*.3,1.05,Math.sin(i)*.3,g);l.rotation.set(Math.sin(i)*1.1,0,-Math.cos(i)*1.1)}return g}};
function deco(k,x,z){const g=new T.Group();g.position.set(x,0,z);S.add(g);blk(x,z,2.6,1.2);
if(k==='rose'){box(2.4,.5,1,0x7a5a3a,0,.25,0,g);for(let i=0;i<6;i++){const f=MD.rose();f.position.set(-1+i*.4,.5,rr(-.2,.2));g.add(f)}}
if(k==='health'){box(1.6,1.9,.8,0xdfe6ea,0,.95,0,g);[0,1,2].forEach(i=>{const b=MD.flask([0xe45858,0x58a5e4,0x7ad17a][i]);b.position.set(-.5+i*.5,1.9,0);g.add(b)})}
if(k==='beauty'){box(2,.9,.9,0xf0e6ee,0,.45,0,g);box(1.4,1.5,.05,0xdff0f5,0,1.65,-.4,g);[0,1].forEach(i=>{const b=MD.bottle(i?0xf2b8c6:0xcfa5e0);b.position.set(-.5+i*1,.9,.1);g.add(b)})}
if(k==='life'){box(2.4,.9,1,0xcfcfcf,0,.45,0,g);cyl(.25,.25,.3,0x888e99,-.6,1.05,0,g);const b=MD.bread();b.position.set(.5,.9,0);g.add(b)}
if(k==='saudi'){const p=MD.palm();p.scale.setScalar(2.2);g.add(p)}}
